name: Cypress tests

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      test_tag:
        description: Tag da suíte a executar
        required: true
        type: choice
        options:
          - "@regression_test"
          - "@front"
          - "@api"
        default: "@regression_test"

permissions:
  contents: read

jobs:
  cypress:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run Cypress tests
        run: npm test -- --env "tags=${{ inputs.test_tag || '@regression_test' }}"

      - name: Upload Cypress artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-artifacts
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
